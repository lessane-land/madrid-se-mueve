name: tiempo
on:
  schedule:
    - cron: "17 6 3,18 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/tiempo.py
      - run: |
          git config user.name "tiempo bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tiempo.csv
          git diff --cached --quiet || (git commit -m "Refresh Madrid daily weather" && git push)
